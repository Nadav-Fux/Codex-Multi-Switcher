name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CODEX_PROFILE_TEAM_ID: ${{ secrets.CODEX_PROFILE_TEAM_ID }}
      APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      CODEX_PROFILE_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.CODEX_PROFILE_APP_PROVISIONING_PROFILE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate release tag and required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          }
          source version.env
          [[ "${RELEASE_TAG#v}" == "$MARKETING_VERSION" ]] || {
            echo "Tag $RELEASE_TAG does not match version.env ($MARKETING_VERSION)."
            exit 1
          }
          for name in \
            CODEX_PROFILE_TEAM_ID APP_IDENTITY APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD CODEX_PROFILE_APP_PROVISIONING_PROFILE_BASE64 \
            APPLE_ID APPLE_TEAM_ID APP_SPECIFIC_PASSWORD \
            SPARKLE_ED_PUBLIC_KEY SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Install signing certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-multi-switcher-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12_PATH="$RUNNER_TEMP/codex-multi-switcher-developer-id.p12"
          PROFILE_PATH="$RUNNER_TEMP/codex-multi-switcher.provisionprofile"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$P12_PATH"
          printf '%s' "$CODEX_PROFILE_APP_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"
          {
            echo "CODEX_PROFILE_APP_PROVISIONING_PROFILE=$PROFILE_PATH"
            echo "CODEX_RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and generate update feed
        shell: bash
        run: |
          set -euo pipefail
          source version.env
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists."
            exit 1
          fi

          previous_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            if [[ "$previous_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              IFS='.' read -r new_major new_minor new_patch <<< "${RELEASE_TAG#v}"
              IFS='.' read -r old_major old_minor old_patch <<< "${previous_tag#v}"
              if (( new_major < old_major || (new_major == old_major && new_minor < old_minor) || (new_major == old_major && new_minor == old_minor && new_patch <= old_patch) )); then
                echo "Release $RELEASE_TAG must be newer than the current latest release $previous_tag."
                exit 1
              fi
            fi
            previous_feed="$RUNNER_TEMP/previous-appcast.xml"
            mkdir -p "$RUNNER_TEMP/previous-feed"
            if gh release download "$previous_tag" --pattern appcast.xml --dir "$RUNNER_TEMP/previous-feed" >/dev/null 2>&1; then
              cp "$RUNNER_TEMP/previous-feed/appcast.xml" "$previous_feed"
              cp "$previous_feed" appcast.xml
            fi
          fi

          VERSION="$MARKETING_VERSION" Scripts/release_app.sh
          gh release create "$RELEASE_TAG" \
            .build/release/CodexMultiSwitcher-"$MARKETING_VERSION".dmg \
            .build/release/CodexMultiSwitcher-"$MARKETING_VERSION".dmg.sha256 \
            .build/release/codex-multi-switcher.rb \
            appcast.xml \
            --title "Codex Multi Switcher $RELEASE_TAG" \
            --generate-notes \
            --latest \
            --verify-tag

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CODEX_PROFILE_APP_PROVISIONING_PROFILE:-}" ]]; then
            rm -f "$CODEX_PROFILE_APP_PROVISIONING_PROFILE"
          fi
          if [[ -n "${CODEX_RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$CODEX_RELEASE_KEYCHAIN_PATH" || true
          fi
